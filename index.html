<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="世界信号：国际新闻事实、原文链接和信号解读。"><title>世界信号 · Global Signal</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#173b32;background:#f7f8f4}*{box-sizing:border-box}body{margin:0}a{color:inherit}.wrap{max-width:1190px;margin:auto;padding:0 24px}header{border-bottom:1px solid #d8e2d8;background:#fff}.nav{display:flex;justify-content:space-between;align-items:center;min-height:76px;gap:15px}.brand{font-size:25px;letter-spacing:-1px;font-weight:800;text-decoration:none}.brand small{display:block;letter-spacing:2.2px;font-size:10px;font-weight:600;color:#688177}.pill{border:1px solid #c8d7cc;padding:8px 12px;border-radius:30px;color:#476b5e;font-size:12px}.hero{padding:66px 0 45px;border-bottom:1px solid #dbe4db}.eyebrow{color:#8c9864;letter-spacing:3px;font-size:11px;font-weight:800}.hero h1{font-size:clamp(42px,6vw,80px);line-height:1.1;letter-spacing:-3px;margin:20px 0}.hero p{font-size:17px;max-width:640px;line-height:1.85;color:#587267}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:32px 0 16px}.tab{background:transparent;border:1px solid #cbd8ce;border-radius:30px;padding:10px 16px;cursor:pointer;color:#476859}.tab.active{background:#173d31;color:white;border-color:#173d31}input{margin-left:auto;min-width:230px;border:1px solid #cbd8ce;border-radius:30px;padding:11px 17px;background:white;outline-color:#749880}.status{color:#738b7b;font-size:12px;margin:12px 0 25px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;padding-bottom:70px}.story{background:white;border:1px solid #dde6db;border-radius:16px;padding:26px;display:flex;flex-direction:column;gap:12px;min-height:300px;box-shadow:0 5px 25px #24423108}.meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;color:#6a8476;font-size:12px}.cat{color:#376b55;font-weight:700}.story h2{font-size:21px;line-height:1.48;margin:0;letter-spacing:-.4px}.summary{font-size:14px;color:#617669;line-height:1.85;margin:0}.signal{border-left:3px solid #b4b98a;background:#f5f7ee;padding:14px 16px;border-radius:0 8px 8px 0;font-size:14px;line-height:1.8;color:#455d48}.signal strong{display:block;font-size:12px;letter-spacing:1px;margin-bottom:5px;color:#467459}.source{margin-top:auto;font-size:12px;color:#356853;text-decoration:underline;text-underline-offset:4px}footer{border-top:1px solid #dce5dc;padding:28px 0;color:#708879;font-size:12px;line-height:1.8}.empty{grid-column:1/-1;padding:60px 25px;text-align:center;color:#648072}.warning{margin:15px 0;background:#fff9e9;border:1px solid #e6dabb;color:#735f2e;border-radius:10px;padding:12px 16px;font-size:13px;line-height:1.7}@media(max-width:700px){.grid{grid-template-columns:1fr}.hero{padding:42px 0 25px}.hero h1{letter-spacing:-1.5px}.toolbar input{margin-left:0;width:100%}.nav{min-height:70px}.pill{display:none}.story{min-height:0}}
</style></head><body>
<header><div class="wrap nav"><a class="brand" href="./">世界信号<small>GLOBAL SIGNAL · WORLD BRIEFING</small></a><span class="pill">事实 · 背景 · 信号</span></div></header>
<main class="wrap"><section class="hero"><div class="eyebrow">GLOBAL AFFAIRS · THE BIG PICTURE</div><h1>读懂世界。<br>看见信号。</h1><p>重要国际新闻，每条附上原始媒体链接与独立解读。区分已报道的事实、可能的影响，以及值得继续关注的变化。</p></section>
<div class="toolbar"><button class="tab active" data-category="全部">全部</button><button class="tab" data-category="地缘政治">地缘政治</button><button class="tab" data-category="经济金融">经济金融</button><button class="tab" data-category="科技产业">科技产业</button><button class="tab" data-category="能源气候">能源气候</button><input id="search" aria-label="搜索新闻" placeholder="搜索新闻、国家、关键词"></div>
<div id="status" class="status">正在载入新闻...</div><div id="notice"></div><div class="grid" id="stories" aria-live="polite"></div></main>
<footer><div class="wrap">© GLOBAL SIGNAL · 新闻归原始媒体所有；本站提供来源链接及独立的推断性解读。自动化生成的内容可能出错，重要事实请核对原文。</div></footer>
<script>
let items=[],category="全部",demo=false;
const grid=document.getElementById("stories"),status=document.getElementById("status"),notice=document.getElementById("notice");
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
function render(){grid.replaceChildren();const q=document.getElementById("search").value.trim().toLowerCase();const shown=items.filter(s=>(category==="全部"||s.category===category)&&[s.title,s.summary,s.signal,s.source].join(" ").toLowerCase().includes(q));status.textContent="共 "+shown.length+" 条报道"+(demo?" · 示例数据":" · 已更新数据");if(!shown.length){grid.append(el("div","empty","当前筛选没有新闻。"));return}
for(const s of shown){const card=el("article","story"),meta=el("div","meta"),c=el("span","cat",s.category||"国际"),date=el("span","",s.published?new Date(s.published).toLocaleDateString("zh-CN"):"");meta.append(c,date);card.append(meta,el("h2","",s.title||""),el("p","summary",s.summary||""));const signal=el("div","signal");signal.append(el("strong","", "信号观察 · "+(s.signal_type||"分析")),document.createTextNode(s.signal||"暂无分析"));card.append(signal);try{const u=new URL(s.url);if(u.protocol==="https:"||u.protocol==="http:"){const a=el("a","source","阅读原文 · "+(s.source||"来源"));a.href=u.href;a.target="_blank";a.rel="noopener noreferrer";card.append(a)}}catch{}grid.append(card)}
}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{category=b.dataset.category;document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t===b));render()}));document.getElementById("search").addEventListener("input",render);
fetch("./data/news.json?ts="+Date.now()).then(r=>{if(!r.ok)throw Error("无法读取数据");return r.json()}).then(d=>{items=Array.isArray(d.stories)?d.stories:[];demo=!!d.demo;if(demo)notice.append(el("div","warning","当前显示演示数据。请到 GitHub Actions 手动运行新闻更新任务。"));else if(d.note)notice.append(el("div","warning",d.note));render()}).catch(e=>{status.textContent="读取失败";notice.append(el("div","warning","暂时无法加载新闻数据："+e.message+"。请确认 data/news.json 存在。"))});
</script></body></html>
